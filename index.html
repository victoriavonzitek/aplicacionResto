<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>restaurante</title>
    <link rel="stylesheet"
     href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <section class="container">

        <header>
            <div class="degradado"></div>
            <div class="bienvenida"><h3>VON ZITEK RESTAURANT</h3>
                <h6>¡Bienvenido a nuestro restaurante!</h6></div>
                
            <div class="buscador">
                <i class="cuadrado-boton center fa fa-location-dot"> </i>
                    <input type="text" placeholder="Buscar tu restaurante favorito">
                    <button class="btn-buscar"><i class="fa fa-search"></i></button>
               
            </div>
        </header>

        <main>
           <nav class="categorias">

            <a class="item-categoria" href="#">
                <i class="fa fa-pizza-slice"></i>
                <span>pizza</span>
            </a>
            
            <a class="item-categoria" href="#">
                <i class= "fa fa-burger"></i>
                <span>burger</span>
            </a>

            <a class="item-categoria" href="#">
                <i class= "fa fa-utensils"></i>
                <span>comida</span>
            </a>

            <a class="item-categoria" href="#">
                <i class= "fa fa-fish"></i>
                <span>sushi</span>
            </a>

             <a class="item-categoria" href="#">
                <i class= "fa fa-wine-glass"></i>
                <span>escabio</span>
            </a>

           
           </nav>
           <section class="restaurante"></section>

        </main>

    </section>

    <footer class="footer"></footer>



<!-- comentario pa probar -->
</body>
</html>
